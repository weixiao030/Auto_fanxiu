name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression (isolated fixtures only)
        run: python -X utf8 -m unittest discover -s tests -q
      - name: Browser script syntax
        run: |
          node --check web/app.js
          node --check web/inventory.js
          node --check web/project-info.js
